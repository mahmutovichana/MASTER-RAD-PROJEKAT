<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raiffeisen Data Produkti</title>
    <base href="/" />

    <!-- Preconnect to improve resource loading performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />

    <!-- Critical CSS inline first -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/mud-theme.css" />
    <link rel="stylesheet" href="css/app.css" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="icon.jpg" />

    <!-- Preload images -->
    <link rel="preload" as="image" href="/RBI-Logo-Bank-St-Squared-Col-Pos-RGB.jpg" />
    <link rel="preload" as="image" href="/RBI-Logo-Bank-St-Squared-Col-Neg-RGB.jpg" />
</head>

<body>
    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    
    <!-- Load Blazor async to prevent render blocking -->
    <script src="_framework/blazor.webassembly.js" async></script>
    
    <!-- Defer MudBlazor JS - not needed for initial render -->
    <script src="_content/MudBlazor/MudBlazor.min.js" defer></script>
</body>

</html>
